# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  car-app:
    build:
      context: .
    ports:
      - 8080:8080
      - 9091:9091
    volumes:
      - ./appdata:/appdir
    depends_on:
      cardb:
        condition: service_healthy
      solr:
        condition: service_healthy

  cardb:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: car
      MYSQL_USER: mmpataki
      MYSQL_PASSWORD: test@123
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - /var/lib/mysql
      - ./docker-stuff/init-db:/docker-entrypoint-initdb.d

  solr:
    image: solr:9
    ports:
      - "8983:8983"
    command:
      - solr-precreate
      - car
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/car/admin/ping"]
      interval: 20s
      timeout: 5s
      retries: 20
      start_period: 10s

  sdfs-master:
    build:
      context: ../sdfs
    ports:
      - 5001:5001
    container_name: sdfs-master
    command: ["java", "-jar", "sdfs-app.jar", "namenode", "--namedir", "/data/nndir"]
    networks:
      - sdfsnet
    volumes:
      - /data

  sdfs-worker:
    build:
      context: ../sdfs
    container_name: sdfs-datanode
    command: ["java", "-jar", "sdfs-app.jar", "datanode", "--nnhost", "sdfs-master", "--nnport", "5001", "--dndir", "/data/dndir"]
    networks:
      - sdfsnet
    volumes:
      - /data

networks: 
  sdfsnet:

